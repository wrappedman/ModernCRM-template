<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فراموشی رمز عبور | مدرن‌CRM</title>
<meta name="description" content="بازیابی رمز عبور حساب کاربری">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
</head>
<body data-shell="none" data-page="forgot" style="background:radial-gradient(circle at 15% 10%, var(--brand-soft), transparent 40%), radial-gradient(circle at 85% 90%, var(--info-soft), transparent 42%), var(--bg)" data-win-auto="off">

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 18px">
  <div style="width:100%;max-width:460px">
    <div class="d-flex items-center gap-3 mb-5 justify-center">
      <span class="brand-mark" data-icon="sparkles" data-icon-size="22"></span>
      <div class="brand-name">مدرن‌CRM</div>
    </div>

    <div class="card">
      <div class="card-body" style="padding:26px">
        <div class="modal-icon info" style="margin-bottom:16px"><span data-icon="key" data-icon-size="26"></span></div>
        <h1 style="font-size:var(--fs-xl);text-align:center">بازیابی رمز عبور</h1>
        <p class="fs-md text-muted text-center mt-2 mb-5" style="line-height:2">
          ایمیل یا شماره همراه حساب خود را وارد کنید؛ لینک بازنشانی رمز برای شما ارسال می‌شود.
        </p>

        <form data-demo-form="لینک بازنشانی رمز برای شما ارسال شد." id="fpForm">
          <div class="form-group">
            <label class="form-label" for="ident">ایمیل یا شماره همراه <span class="req">*</span></label>
            <div class="input-wrap">
              <span class="icon lead" data-icon="mail" data-icon-size="17"></span>
              <input class="input input-lg ltr" id="ident" required placeholder="name@company.ir یا 09123456789">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">روش دریافت</label>
            <div class="grid-2">
              <label class="panel d-flex items-center gap-3" style="cursor:pointer;margin:0">
                <input type="radio" name="method" checked style="accent-color:var(--brand)">
                <span><span class="d-block fw-600 fs-sm">ایمیل</span><span class="fs-xs text-muted">name@company.ir</span></span>
              </label>
              <label class="panel d-flex items-center gap-3" style="cursor:pointer;margin:0">
                <input type="radio" name="method" style="accent-color:var(--brand)">
                <span><span class="d-block fw-600 fs-sm">پیامک</span><span class="fs-xs text-muted num">۰۹۱۲***۶۷۸۹</span></span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <div class="d-flex items-center justify-between mb-2">
              <label class="form-label" style="margin:0">کد امنیتی</label>
              <button type="button" class="fs-sm" data-icon="refresh" id="refreshCaptcha">تصویر جدید</button>
            </div>
            <div class="d-flex gap-3 items-center">
              <div class="code-box flex-1 text-center" style="font-size:20px;letter-spacing:6px;font-weight:700" id="captcha">۸۴۲۹</div>
              <input class="input ltr" style="width:130px" placeholder="کد را وارد کنید" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block mt-2">
            <span data-icon="send" data-icon-size="18"></span> ارسال لینک بازنشانی
          </button>
        </form>

        <div class="alert alert-info mt-4">
          <span data-icon="info" data-icon-size="18"></span>
          <div>
            <div class="alert-title">ایمیلی دریافت نکردید؟</div>
            <div class="alert-desc">پوشه اسپم را بررسی کنید یا پس از ۲ دقیقه دوباره درخواست دهید.</div>
          </div>
        </div>
      </div>
      <div class="card-foot">
        <a class="btn btn-soft btn-sm" href="login.html"><span data-icon="arrow-right" data-icon-size="15"></span> بازگشت به صفحه ورود</a>
        <a class="btn btn-ghost btn-sm ms-auto" href="otp.html">ورود با کد یکبار مصرف</a>
      </div>
    </div>

    <div class="text-center mt-4 fs-sm text-muted">
      نیاز به کمک دارید؟ <a href="help.html">تماس با پشتیبانی</a>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/windows.js"></script>
<script>
(function () {
  'use strict';
  var CRM = window.CRM;
  CRM.$('#fpForm').addEventListener('submit', function () {
    setTimeout(function () { window.location.href = 'reset-password.html'; }, 1000);
  });
  CRM.$('#refreshCaptcha').addEventListener('click', function (e) {
    e.preventDefault();
    CRM.$('#captcha').textContent = CRM.fa(Math.floor(1000 + Math.random() * 8999));
    CRM.toast({ type: 'info', title: 'کد امنیتی جدید ساخته شد', duration: 2000 });
  });
})();
</script>
</body>
</html>
