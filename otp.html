<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود با کد یکبار مصرف | مدرن‌CRM</title>
<meta name="description" content="تایید دو مرحله‌ای با کد یکبار مصرف پیامکی">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<script>(function(){try{var t=localStorage.getItem('moderncrm-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body data-shell="none" data-page="otp" style="background:radial-gradient(circle at 80% 10%, var(--brand-soft), transparent 42%), radial-gradient(circle at 15% 85%, var(--info-soft), transparent 40%), var(--bg)" data-win-auto="off">

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 18px">
  <div style="width:100%;max-width:470px">

    <div class="d-flex items-center gap-3 mb-5 justify-center">
      <span class="brand-mark" data-icon="sparkles" data-icon-size="22"></span>
      <div class="brand-name">مدرن‌CRM</div>
      <button class="tb-icon" data-theme-toggle aria-label="تغییر تم" data-icon-size="19"></button>
    </div>

    <div class="card">
      <div class="card-body" style="padding:26px">
        <div class="modal-icon info"><span data-icon="fingerprint" data-icon-size="26"></span></div>
        <h1 style="font-size:var(--fs-xl);text-align:center">تایید دو مرحله‌ای</h1>
        <p class="fs-md text-muted text-center mt-2" style="line-height:2">
          کد ۶ رقمی ارسال‌شده به شماره <span class="fw-600 text-strong num">۰۹۱۲***۶۷۸۹</span> را وارد کنید.
        </p>

        <form data-demo-form="کد تایید شد؛ در حال ورود به پنل…" id="otpForm">
          <div class="otp-inputs my-5" data-otp>
            <input class="input" inputmode="numeric" maxlength="1" aria-label="رقم ۱">
            <input class="input" inputmode="numeric" maxlength="1" aria-label="رقم ۲">
            <input class="input" inputmode="numeric" maxlength="1" aria-label="رقم ۳">
            <input class="input" inputmode="numeric" maxlength="1" aria-label="رقم ۴">
            <input class="input" inputmode="numeric" maxlength="1" aria-label="رقم ۵">
            <input class="input" inputmode="numeric" maxlength="1" aria-label="رقم ۶">
          </div>

          <div class="d-flex items-center justify-between mb-4">
            <span class="fs-sm text-muted">ارسال مجدد کد تا <span class="fw-600 num" id="timer">۰۱:۵۹</span></span>
            <button type="button" class="fs-sm" id="resend" disabled>ارسال مجدد کد</button>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block"><span data-icon="check-circle" data-icon-size="18"></span> تایید و ورود</button>
        </form>

        <div class="d-flex gap-3 mt-4">
          <button type="button" class="btn flex-1" data-modal-open="#modalAlt"><span data-icon="qr" data-size="17" data-icon="qr" data-icon-size="17"></span> روش‌های دیگر</button>
          <a class="btn flex-1" href="login.html"><span data-icon="arrow-right" data-icon-size="17"></span> بازگشت</a>
        </div>

        <div class="alert alert-info mt-4" style="margin-bottom:0">
          <span data-icon="info" data-icon-size="18"></span>
          <div>
            <div class="alert-title">کد را دریافت نکردید؟</div>
            <div class="alert-desc">مطمئن شوید پیامک‌ها را مسدود نکرده‌اید. در صورت نیاز از گزینه «روش‌های دیگر» استفاده کنید.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- انتخاب روش دیگر -->
<div class="overlay" id="modalAlt" style="display:none">
  <div class="modal modal-sm" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div><div class="modal-title">روش‌های تایید دیگر</div></div>
      <button class="tb-icon modal-x" data-modal-close="#modalAlt" data-icon="x" data-icon-size="18"></button>
    </div>
    <div class="modal-body d-flex flex-col gap-2">
      <button class="dropdown-item"><span data-icon="mail" data-icon-size="17"></span> ارسال کد به ایمیل سازمانی</button>
      <button class="dropdown-item"><span data-icon="message" data-icon-size="17"></span> تماس صوتی با شماره همراه</button>
      <button class="dropdown-item"><span data-icon="fingerprint" data-icon-size="17"></span> تایید با اپلیکیشن احراز هویت</button>
      <button class="dropdown-item"><span data-icon="headset" data-icon-size="17"></span> تماس با پشتیبانی</button>
    </div>
    <div class="modal-foot">
      <button class="btn btn-block" data-modal-close="#modalAlt">بستن</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/windows.js"></script>
<script>
(function () {
  'use strict';
  var CRM = window.CRM;
  var left = 120, timer = CRM.$('#timer'), btn = CRM.$('#resend');

  function tick() {
    if (left <= 0) {
      btn.disabled = false;
      timer.textContent = '۰۰:۰۰';
      return;
    }
    left--;
    timer.textContent = CRM.fa(('0' + Math.floor(left / 60)).slice(-2) + ':' + ('0' + (left % 60)).slice(-2));
    setTimeout(tick, 1000);
  }
  tick();

  btn.addEventListener('click', function () {
    left = 120; btn.disabled = true; tick();
    CRM.toast({ type: 'success', title: 'کد جدید ارسال شد', msg: 'کد ۶ رقمی به شماره شما پیامک شد.' });
  });

  CRM.$('#otpForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = CRM.$$('[data-otp] input').map(function (i) { return CRM.en(i.value); }).join('');
    if (code.length < 6) {
      CRM.toast({ type: 'danger', title: 'کد ناقص است', msg: 'هر ۶ رقم کد را وارد کنید.' });
      return;
    }
    if (code !== '123456') {
      CRM.toast({ type: 'danger', title: 'کد نادرست', msg: 'در نسخه نمایشی کد صحیح ۱۲۳۴۵۶ است.' });
      CRM.$('[data-otp]').parentElement.classList.add('anim-shake');
      return;
    }
    CRM.toast({ type: 'success', title: 'کد تایید شد', msg: 'در حال انتقال به داشبورد…' });
    setTimeout(function () { window.location.href = 'dashboard.html'; }, 1000);
  });

  CRM.$$('[data-otp] input')[0].focus();
})();
</script>
</body>
</html>
