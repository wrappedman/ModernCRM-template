<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چاپ فاکتور | مدرن‌CRM</title>
<meta name="description" content="پیش‌نمایش چاپ صورتحساب فروش و پیش‌فاکتور">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<style>
  .sheet {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    max-width: 1060px;
    margin: 0 auto;
    padding: 30px 32px;
    position: relative;
    font-size: 13px;
  }
  .doc-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin-bottom: 18px; }
  .doc-title { font-size: 22px; font-weight: 800; color: var(--text-strong); text-align: center; }
  .doc-title small { display: block; font-size: 11.5px; color: var(--text-soft); font-weight: 500; }
  .doc-brand { display: flex; align-items: center; gap: 10px; }
  .doc-meta { justify-self: end; display: grid; grid-template-columns: auto auto; gap: 4px 12px; font-size: 12.5px; }
  .doc-meta dt { color: var(--text-muted); }
  .doc-meta dd { font-weight: 700; color: var(--text-strong); }

  .doc-sec { border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
  .doc-sec-title {
    background: var(--surface-2); border-bottom: 1px solid var(--border-strong);
    padding: 8px 14px; font-weight: 700; color: var(--text-strong); text-align: center; font-size: 13.5px;
  }
  .doc-kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px 18px; padding: 12px 16px; }
  .doc-kv > div { display: flex; gap: 6px; min-width: 0; }
  .doc-kv b { color: var(--text-muted); font-weight: 500; white-space: nowrap; }
  .doc-kv span { color: var(--text-strong); font-weight: 600; }
  .doc-kv .span-3 { grid-column: span 3; }
  .doc-kv .span-2 { grid-column: span 2; }

  /* بلوک‌های پیش‌فاکتور با برچسب عمودی (مثل نسخه قبلی) */
  .side-block { display: grid; grid-template-columns: 38px 1fr; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
  .side-label {
    background: var(--ink); color: var(--on-ink); font-weight: 700; font-size: 12.5px;
    writing-mode: vertical-rl; text-align: center; display: grid; place-items: center; letter-spacing: 1px;
  }
  .side-body { padding: 12px 16px; }

  .doc-table { width: 100%; border-collapse: collapse; }
  .doc-table th, .doc-table td { border: 1px solid var(--border-strong); padding: 8px 9px; font-size: 12.5px; vertical-align: middle; }
  .doc-table th { background: var(--surface-2); font-weight: 700; color: var(--text-strong); text-align: center; line-height: 1.6; }
  .doc-table th small { display: block; font-weight: 500; color: var(--text-soft); font-size: 10.5px; }
  .doc-table td.n { text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .doc-table td.c { text-align: center; }
  .doc-table tfoot td { background: var(--surface-2); font-weight: 700; color: var(--text-strong); }

  .sign-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 26px; text-align: center; font-size: 12.5px; }
  .sign-row .who { color: var(--text-muted); }
  .sign-row .nm { font-weight: 700; margin-top: 4px; color: var(--text-strong); min-height: 20px; }
  .sign-row .ln { border-top: 1px dashed var(--border-strong); margin-top: 34px; padding-top: 6px; color: var(--text-soft); font-size: 11px; }
  .notes { margin-top: 18px; font-size: 12.5px; line-height: 2.1; }
  .notes ul { padding-inline-start: 18px; list-style: disc; color: var(--text); }
  .stamp {
    position: absolute; inset-inline-start: 48px; bottom: 120px;
    width: 128px; height: 128px; border-radius: 50%;
    border: 3px solid var(--brand); color: var(--brand);
    display: grid; place-items: center; text-align: center;
    font-weight: 700; transform: rotate(-12deg); opacity: .45;
    font-size: 12px; line-height: 1.7; pointer-events: none;
  }
  @media (max-width: 760px) {
    .sheet { padding: 18px 14px; }
    .doc-head { grid-template-columns: 1fr; text-align: center; }
    .doc-brand, .doc-meta { justify-self: center; }
    .doc-kv { grid-template-columns: 1fr; }
    .doc-kv .span-3, .doc-kv .span-2 { grid-column: auto; }
    .sheet .table-scroll { overflow-x: auto; }
    .doc-table { min-width: 760px; }
  }
  @media print {
    .no-print { display: none !important; }
    body { padding: 0 !important; background: #fff !important; }
    .sheet { box-shadow: none; border: 0; padding: 0; max-width: 100%; }
    .doc-sec-title, .doc-table th, .doc-table tfoot td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .side-label { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body data-shell="none" data-page="print-invoice" style="background:var(--bg-soft);padding:26px 16px 60px" data-win-auto="off">

<!-- نوار ابزار (در چاپ نمایش داده نمی‌شود) -->
<div class="no-print" style="max-width:1060px;margin:0 auto 18px">
  <div class="card">
    <div class="card-body tight d-flex flex-wrap items-center gap-3">
      <a class="btn" href="invoices.html"><span data-icon="arrow-right" data-icon-size="16"></span> بازگشت به فاکتورها</a>
      <div class="segmented" id="docSwitch">
        <button class="seg" data-doc="invoice"><span data-icon="invoice" data-icon-size="14"></span> صورتحساب فروش</button>
        <button class="seg" data-doc="proforma"><span data-icon="file" data-icon-size="14"></span> پیش‌فاکتور</button>
      </div>
      <div class="d-flex gap-2 flex-wrap ms-auto">
        <button class="btn" data-excel="فاکتور"><span data-icon="download" data-icon-size="16"></span> خروجی</button>
        <button class="btn" data-tip="ارسال پیامک لینک فاکتور به مشتری" onclick="CRM.toast({type:'success',title:'ارسال شد',msg:'لینک فاکتور برای مشتری پیامک شد (نمایشی).'})"><span data-icon="send" data-icon-size="16"></span> ارسال</button>
        <button class="btn btn-primary" data-print><span data-icon="printer" data-icon-size="16"></span> چاپ</button>
      </div>
    </div>
  </div>
</div>

<!-- ============================== برگه سند ============================== -->
<div class="sheet" id="sheet"></div>

<div class="toast-wrap" id="toastWrap"></div>
<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/windows.js"></script>
<script src="assets/js/sales.js"></script>
<script>
(function () {
  'use strict';
  var CRM = window.CRM, S = window.SALES, D = S.data;
  var esc = CRM.esc, fa = CRM.fa, m = S.money;
  var qs = new URLSearchParams(location.search);
  var type = qs.get('type') === 'proforma' ? 'proforma' : 'invoice';
  var invNo = qs.get('no');

  /* سند نمایشی: فاکتور انتخاب‌شده یا نمونه‌ی پیش‌فرض */
  function pickInvoice(t) {
    var list = D.invoices.filter(function (v) { return invNo ? v.no === invNo : v.type === t; });
    return list[0] || D.invoices.filter(function (v) { return v.type === t; })[0];
  }
  function items() {
    return D.sampleItems.map(function (r) {
      var p = S.product(r.pid);
      var gross = r.qty * r.price, disc = r.qty * r.discount, net = gross - disc, tax = Math.round(net * S.VAT);
      return { name: p.name, unit: p.unit, qty: r.qty, price: r.price, gross: gross, disc: disc, net: net, tax: tax, total: net + tax };
    });
  }
  function sum(list, k) { return list.reduce(function (s, x) { return s + x[k]; }, 0); }
  function brand() {
    return '<div class="doc-brand"><span class="brand-mark" data-icon="sparkles" data-icon-size="22"></span>' +
      '<div><div class="fw-700 text-strong" style="font-size:16px">' + esc(D.seller.brand) + '</div><div class="fs-xs text-muted">' + esc(D.seller.name) + '</div></div></div>';
  }
  function kv(pairs) {
    return '<div class="doc-kv">' + pairs.map(function (p) {
      return '<div class="' + (p[2] || '') + '"><b>' + esc(p[0]) + ':</b><span class="' + (p[3] || '') + '">' + esc(p[1]) + '</span></div>';
    }).join('') + '</div>';
  }

  /* ----------------------------------------------------- صورتحساب فروش */
  function invoiceHTML() {
    var v = pickInvoice('invoice'), c = S.company(v.customer) || D.companies[1];
    var person = D.contacts.filter(function (x) { return x.companyCode === c.code; })[0];
    var rows = items(), total = sum(rows, 'total');
    return '' +
      '<div class="doc-head">' + brand() +
        '<div class="doc-title">صورتحساب فروش کالا و خدمات<small>نمونه رسمی — ' + esc(v.kind) + '</small></div>' +
        '<dl class="doc-meta"><dt>شماره سریال:</dt><dd class="num">' + esc(v.no) + '</dd><dt>تاریخ:</dt><dd class="num">' + esc(v.date) + '</dd></dl>' +
      '</div>' +
      '<div class="doc-sec"><div class="doc-sec-title">مشخصات فروشنده</div>' +
        kv([
          ['فروشنده', D.seller.name], ['شماره اقتصادی', D.seller.economic, '', 'num'], ['شماره ملی / ثبت', D.seller.national, '', 'num'],
          ['استان', D.seller.province], ['شهرستان', D.seller.city], ['شهر', D.seller.city],
          ['نشانی', D.seller.address, ''], ['کد پستی', D.seller.postal, '', 'num'], ['تلفن / نمابر', D.seller.phone + ' — ' + D.seller.fax, '', 'num']
        ]) + '</div>' +
      '<div class="doc-sec"><div class="doc-sec-title">مشخصات خریدار</div>' +
        kv([
          ['نام شخص حقیقی / حقوقی', (person ? 'جناب آقای ' + person.name + ' — ' : '') + c.name, 'span-2'], ['شماره اقتصادی', c.economic, '', 'num'],
          ['استان', c.province], ['شهرستان', c.city], ['شماره ملی / ثبت', c.reg, '', 'num'],
          ['نشانی', c.address, 'span-2'], ['کد پستی', c.postal, '', 'num'],
          ['تلفن', c.phone1, '', 'num'], ['نمابر', c.fax, '', 'num']
        ]) + '</div>' +
      '<div class="doc-sec"><div class="doc-sec-title">مشخصات کالا و خدمات ارائه‌شده</div>' +
        '<div class="table-scroll"><table class="doc-table" style="border-style:hidden">' +
          '<thead><tr><th>ردیف</th><th style="min-width:220px">شرح کالا</th><th>مقدار</th><th>واحد</th>' +
          '<th>قیمت واحد<small>(تومان)</small></th><th>جمع کل<small>(تومان)</small></th><th>مبلغ تخفیف<small>(تومان)</small></th>' +
          '<th>جمع پس از تخفیف<small>(تومان)</small></th><th>مالیات<small>(تومان)</small></th><th>عوارض<small>(تومان)</small></th><th>مبلغ کل<small>(تومان)</small></th></tr></thead>' +
          '<tbody>' + rows.map(function (r, i) {
            return '<tr><td class="c num">' + fa(i + 1) + '</td><td>' + esc(r.name) + '</td><td class="c num">' + fa(r.qty) + '</td><td class="c">' + esc(r.unit) + '</td>' +
              '<td class="n">' + m(r.price) + '</td><td class="n">' + m(r.gross) + '</td><td class="n">' + m(r.disc) + '</td><td class="n">' + m(r.net) + '</td>' +
              '<td class="n">' + m(r.tax) + '</td><td class="n">۰</td><td class="n fw-700">' + m(r.total) + '</td></tr>';
          }).join('') + '</tbody>' +
          '<tfoot><tr><td colspan="2">جمع کل به حروف</td><td colspan="8">' + S.words(total) + ' تومان</td><td class="n">' + m(total) + '</td></tr></tfoot>' +
        '</table></div></div>' +
      '<div class="notes"><div class="fw-700 text-strong mb-1">توضیحات</div><ul>' +
        '<li>در صورت استفاده در شرایط متعارف، سیستم‌ها دارای یک‌سال گارانتی می‌باشند.</li>' +
        '<li>سیستم فوق دارای کارتخوان RFID با فرکانس ۱۲۵ کیلوهرتز می‌باشد.</li>' +
        '<li>کلیه اقلام تا زمان تسویه حساب کامل به صورت امانی نزد خریدار محترم خواهد بود.</li>' +
        '<li>تسویه فاکتور به صورت نقدی می‌باشد. در فاکتور فوق هزینه نصب و راه‌اندازی لحاظ نشده است.</li>' +
      '</ul></div>' +
      '<div class="sign-row" style="grid-template-columns:1fr 1fr">' +
        '<div><div class="who">مهر و امضای فروشنده</div><div class="ln">&nbsp;</div></div>' +
        '<div><div class="who">مهر و امضای خریدار</div><div class="ln">&nbsp;</div></div>' +
      '</div>' +
      (S.settleState(v).key === 'paid' ? '<div class="stamp">تسویه شده<br><span class="num">' + esc(v.date) + '</span><br>' + esc(D.seller.brand) + '</div>' : '');
  }

  /* ---------------------------------------------------------- پیش‌فاکتور */
  function proformaHTML() {
    var v = pickInvoice('proforma'), c = S.company(v.customer) || D.companies[1];
    var person = D.contacts.filter(function (x) { return x.companyCode === c.code; })[0];
    var rows = items(), total = sum(rows, 'total');
    return '' +
      '<div class="doc-head">' + brand() +
        '<div class="doc-title">پیش‌فاکتور فروش<small>اعتبار: ۳ روز از تاریخ صدور</small></div>' +
        '<dl class="doc-meta"><dt>تاریخ:</dt><dd class="num">' + esc(v.date) + '</dd><dt>شماره:</dt><dd class="num">' + esc(v.no) + '</dd></dl>' +
      '</div>' +
      '<div class="side-block"><div class="side-label">فروشنده</div><div class="side-body">' +
        kv([['فروشنده', D.seller.name, 'span-2'], ['تلفن', D.seller.phone, '', 'num'], ['آدرس', D.seller.address, 'span-3']]) +
      '</div></div>' +
      '<div class="side-block"><div class="side-label">خریدار</div><div class="side-body">' +
        kv([
          ['خریدار', (person ? 'جناب آقای ' + person.name + ' (' + c.name + ')' : c.name), 'span-2'], ['جناب آقای', person ? person.name : '—'],
          ['آدرس', c.address, 'span-2'], ['تلفن', c.phone1, '', 'num']
        ]) +
      '</div></div>' +
      '<div class="table-scroll"><table class="doc-table">' +
        '<thead><tr><th>ردیف</th><th style="min-width:260px">شرح کالا یا خدمات</th><th>مقدار</th><th>واحد</th><th>قیمت واحد</th><th>مبلغ کل</th><th>ارزش افزوده</th><th>جمع (تومان)</th></tr></thead>' +
        '<tbody>' + rows.map(function (r, i) {
          return '<tr><td class="c num">' + fa(i + 1) + '</td><td>' + esc(r.name) + '</td><td class="c num">' + fa(r.qty) + '</td><td class="c">' + esc(r.unit) + '</td>' +
            '<td class="n">' + m(r.price - (r.disc / r.qty)) + '</td><td class="n">' + m(r.net) + '</td><td class="n">' + m(r.tax) + '</td><td class="n fw-700">' + m(r.total) + '</td></tr>';
        }).join('') + '</tbody>' +
        '<tfoot><tr><td colspan="6">جمع کل به حروف: ' + S.words(total) + ' تومان</td><td class="c">جمع کل</td><td class="n">' + m(total) + '</td></tr></tfoot>' +
      '</table></div>' +
      '<div class="sign-row">' +
        '<div><div class="who">کارشناس فروش</div><div class="nm">' + esc(v.owner) + '</div><div class="ln">امضا</div></div>' +
        '<div><div class="who">مدیریت فروش</div><div class="nm">مهدی کریمی</div><div class="ln">امضا</div></div>' +
        '<div><div class="who">تأیید مشتری</div><div class="nm">&nbsp;</div><div class="ln">مهر و امضا</div></div>' +
      '</div>' +
      '<div class="notes"><div class="fw-700 text-strong mb-1">توضیحات</div><ul>' +
        '<li>تعویض صفحه کلید برای دو دستگاه حضور و غیاب به مدل MB-202 به شماره سریال <span class="ltr">A3S6173860016</span> و <span class="ltr">A3S6192560135</span></li>' +
        '<li>تعویض برد اصلی برای دستگاه حضور و غیاب به مدل EB-112 به شماره سریال <span class="ltr">A5KN184560075</span></li>' +
        '<li>اعتبار پیش‌فاکتور فوق ۳ روز می‌باشد.</li>' +
      '</ul></div>';
  }

  function render() {
    var sheet = CRM.$('#sheet');
    sheet.innerHTML = type === 'proforma' ? proformaHTML() : invoiceHTML();
    document.title = (type === 'proforma' ? 'چاپ پیش‌فاکتور' : 'چاپ صورتحساب فروش') + ' | مدرن‌CRM';
    CRM.$$('#docSwitch .seg').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-doc') === type); });
    if (document.readyState !== 'loading') CRM.init(sheet);
  }
  CRM.$('#docSwitch').addEventListener('click', function (e) {
    var b = e.target.closest('[data-doc]'); if (!b) return;
    type = b.getAttribute('data-doc'); invNo = null;
    history.replaceState(null, '', type === 'proforma' ? '?type=proforma' : location.pathname);
    render();
  });
  render();
})();
</script>
</body>
</html>
